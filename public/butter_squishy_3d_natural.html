<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Squishy 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sriracha&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; min-height: 100%;
    background: #fdf3df;
    font-family: 'Sriracha', 'Segoe UI', sans-serif;
    display: flex; align-items: center; justify-content: center; overflow-y: auto; overflow-x: hidden;
  }
  .app { display: flex; flex-direction: column; align-items: center; padding: 12px; max-width: 100vw; }
  h1 { font-size: 19px; font-weight: 400; color: #7a5b1f; margin: 0 0 4px; text-align: center; }
  .subtitle { font-size: 12.5px; color: #a3854f; margin: 0 0 10px; text-align: center; max-width: 480px; line-height: 1.5; }
  #canvasHolder { width: 92vw; height: 58vh; max-width: 1100px; max-height: 560px; touch-action: none; }
  #canvasHolder canvas { display: block; width: 100%; height: 100%; }
  .hint { margin-top: 8px; font-size: 12.5px; color: #9c8250; text-align: center; min-height: 16px; max-width: 340px; line-height: 1.5; }
  .btn {
    margin-top: 14px; padding: 10px 24px; font-size: 15px; color: #fff;
    background: linear-gradient(180deg, #f0b23a, #d68c1f); border: none; border-radius: 999px;
    box-shadow: 0 4px 10px rgba(180, 120, 20, 0.35); cursor: pointer;
    display: inline-flex; align-items: center; gap: 8px;
    transition: transform 0.15s ease, box-shadow 0.15s ease;
    font-family: 'Sriracha', 'Segoe UI', sans-serif;
  }
  .btn:hover { transform: translateY(-1px); box-shadow: 0 6px 14px rgba(180,120,20,0.45); }
  .btn:active { transform: translateY(1px) scale(0.97); }
</style>
</head>
<body>
<div class="app">
  <h1>Squishy 3D</h1>
  <p class="subtitle">กดค้างเพื่อบีบของเล่นแต่ละชิ้น &nbsp;•&nbsp; ลากที่ตัวไหนหมุนเฉพาะตัวนั้น &nbsp;•&nbsp; ลากสไลม์เพื่อดึงยืด</p>

  <div id="canvasHolder"></div>

  <button class="btn" id="resetBtn"><span>&#8635;</span> รีเซ็ตแว็กซ์</button>
  <div class="hint" id="hint">กดค้างที่ของเล่นเพื่อบีบ</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
  /* ---------- tiny self-contained Voronoi (half-plane clipping, no external deps) ---------- */
  function clipHalfPlane(poly, a, b, c){
    var result = [];
    var n = poly.length;
    for (var i = 0; i < n; i++){
      var cur = poly[i], prev = poly[(i - 1 + n) % n];
      var curVal = a * cur[0] + b * cur[1];
      var prevVal = a * prev[0] + b * prev[1];
      var curIn = curVal <= c, prevIn = prevVal <= c;
      if (curIn !== prevIn){
        var denom = a * (cur[0] - prev[0]) + b * (cur[1] - prev[1]);
        var t = denom !== 0 ? (c - prevVal) / denom : 0;
        result.push([prev[0] + t * (cur[0] - prev[0]), prev[1] + t * (cur[1] - prev[1])]);
      }
      if (curIn) result.push(cur);
    }
    return result;
  }
  function voronoiCellPolygon(seeds, i, bounds){
    var poly = [[bounds[0], bounds[1]], [bounds[2], bounds[1]], [bounds[2], bounds[3]], [bounds[0], bounds[3]]];
    var pi = seeds[i];
    for (var j = 0; j < seeds.length; j++){
      if (j === i) continue;
      var pj = seeds[j];
      var a = 2 * (pj[0] - pi[0]);
      var b = 2 * (pj[1] - pi[1]);
      var c = (pj[0] * pj[0] + pj[1] * pj[1]) - (pi[0] * pi[0] + pi[1] * pi[1]);
      poly = clipHalfPlane(poly, a, b, c);
      if (poly.length === 0) break;
    }
    return poly;
  }
</script>
<script>
(function(){
  var holder = document.getElementById('canvasHolder');
  var hint = document.getElementById('hint');
  var resetBtn = document.getElementById('resetBtn');

  /* ---------- audio: deep bassy + crisp synthesized crack / squish sounds ---------- */
  var audioCtx = null;
  var noiseBuffer = null;
  function ensureAudio(){
    if (!audioCtx){
      var Ctx = window.AudioContext || window.webkitAudioContext;
      if (!Ctx) return null;
      audioCtx = new Ctx();
    }
    if (audioCtx.state === 'suspended') audioCtx.resume();
    return audioCtx;
  }
  function getNoiseBuffer(){
    if (noiseBuffer) return noiseBuffer;
    var len = audioCtx.sampleRate * 0.5;
    noiseBuffer = audioCtx.createBuffer(1, len, audioCtx.sampleRate);
    var data = noiseBuffer.getChannelData(0);
    for (var i = 0; i < len; i++) data[i] = Math.random() * 2 - 1;
    return noiseBuffer;
  }
  function playCrack(){
    var ctx = ensureAudio();
    if (!ctx) return;
    var now = ctx.currentTime;
    var thump = ctx.createOscillator();
    thump.type = 'triangle';
    thump.frequency.setValueAtTime(88 + Math.random() * 28, now);
    thump.frequency.exponentialRampToValueAtTime(26, now + 0.19);
    var tg = ctx.createGain();
    tg.gain.setValueAtTime(0.0001, now);
    tg.gain.linearRampToValueAtTime(0.5 + Math.random() * 0.14, now + 0.01);
    tg.gain.exponentialRampToValueAtTime(0.001, now + 0.24);
    thump.connect(tg); tg.connect(ctx.destination);
    thump.start(now); thump.stop(now + 0.26);

    var thump2 = ctx.createOscillator();
    thump2.type = 'sine';
    thump2.frequency.setValueAtTime(52, now + 0.045);
    thump2.frequency.exponentialRampToValueAtTime(22, now + 0.24);
    var tg2 = ctx.createGain();
    tg2.gain.setValueAtTime(0.0001, now + 0.045);
    tg2.gain.linearRampToValueAtTime(0.22, now + 0.06);
    tg2.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
    thump2.connect(tg2); tg2.connect(ctx.destination);
    thump2.start(now + 0.045); thump2.stop(now + 0.32);

    var bodyNoise = ctx.createBufferSource();
    bodyNoise.buffer = getNoiseBuffer();
    bodyNoise.playbackRate.value = 0.4 + Math.random() * 0.15;
    var lp = ctx.createBiquadFilter();
    lp.type = 'lowpass';
    lp.frequency.value = 180 + Math.random() * 100;
    var bg = ctx.createGain();
    bg.gain.setValueAtTime(0.0001, now);
    bg.gain.linearRampToValueAtTime(0.36, now + 0.012);
    bg.gain.exponentialRampToValueAtTime(0.001, now + 0.24);
    bodyNoise.connect(lp); lp.connect(bg); bg.connect(ctx.destination);
    bodyNoise.start(now); bodyNoise.stop(now + 0.26);

    var burstCount = 4 + Math.floor(Math.random() * 4);
    for (var i = 0; i < burstCount; i++){
      var t0 = now + i * (0.011 + Math.random() * 0.018);
      var src = ctx.createBufferSource();
      src.buffer = getNoiseBuffer();
      src.playbackRate.value = 1.3 + Math.random() * 1.5;
      var bp = ctx.createBiquadFilter();
      bp.type = 'bandpass';
      bp.frequency.value = 1800 + Math.random() * 4200;
      bp.Q.value = 2.2 + Math.random() * 2.6;
      var g = ctx.createGain();
      var d = 0.013 + Math.random() * 0.02;
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.linearRampToValueAtTime(0.24 + Math.random() * 0.2, t0 + 0.002);
      g.gain.exponentialRampToValueAtTime(0.001, t0 + d);
      src.connect(bp); bp.connect(g); g.connect(ctx.destination);
      src.start(t0); src.stop(t0 + d + 0.01);
    }
  }
  function playSquishThud(){
    var ctx = ensureAudio();
    if (!ctx) return;
    var now = ctx.currentTime;
    var osc = ctx.createOscillator();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(85, now);
    osc.frequency.exponentialRampToValueAtTime(28, now + 0.3);
    var gain = ctx.createGain();
    gain.gain.setValueAtTime(0.0001, now);
    gain.gain.linearRampToValueAtTime(0.36, now + 0.03);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.36);
    osc.connect(gain); gain.connect(ctx.destination);
    osc.start(now); osc.stop(now + 0.38);

    var noise = ctx.createBufferSource();
    noise.buffer = getNoiseBuffer();
    noise.playbackRate.value = 0.32;
    var lp = ctx.createBiquadFilter();
    lp.type = 'lowpass';
    lp.frequency.value = 190;
    var ng = ctx.createGain();
    ng.gain.setValueAtTime(0.0001, now);
    ng.gain.linearRampToValueAtTime(0.16, now + 0.05);
    ng.gain.exponentialRampToValueAtTime(0.001, now + 0.36);
    noise.connect(lp); lp.connect(ng); ng.connect(ctx.destination);
    noise.start(now); noise.stop(now + 0.38);
  }
  function playDumplingSquish(){
    var ctx = ensureAudio();
    if (!ctx) return;
    var now = ctx.currentTime;

    /* soft foam "fwoosh" - filtered noise swell, no crunch, no sharp transient */
    var noise = ctx.createBufferSource();
    noise.buffer = getNoiseBuffer();
    noise.playbackRate.value = 0.8;
    var bp = ctx.createBiquadFilter();
    bp.type = 'bandpass';
    bp.frequency.setValueAtTime(520, now);
    bp.frequency.exponentialRampToValueAtTime(230, now + 0.24);
    bp.Q.value = 0.7;
    var ng = ctx.createGain();
    ng.gain.setValueAtTime(0.0001, now);
    ng.gain.linearRampToValueAtTime(0.26, now + 0.07);
    ng.gain.exponentialRampToValueAtTime(0.001, now + 0.34);
    noise.connect(bp); bp.connect(ng); ng.connect(ctx.destination);
    noise.start(now); noise.stop(now + 0.36);

    /* gentle round "boop", higher and softer than the butter thud */
    var osc = ctx.createOscillator();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(215, now);
    osc.frequency.exponentialRampToValueAtTime(120, now + 0.26);
    var gain = ctx.createGain();
    gain.gain.setValueAtTime(0.0001, now);
    gain.gain.linearRampToValueAtTime(0.24, now + 0.032);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.32);
    osc.connect(gain); gain.connect(ctx.destination);
    osc.start(now); osc.stop(now + 0.34);

    /* satisfying soft resonant "boing" tail, like memory foam settling after the press */
    var tail = ctx.createOscillator();
    tail.type = 'sine';
    tail.frequency.setValueAtTime(300, now + 0.08);
    tail.frequency.exponentialRampToValueAtTime(180, now + 0.32);
    var tailGain = ctx.createGain();
    tailGain.gain.setValueAtTime(0.0001, now + 0.08);
    tailGain.gain.linearRampToValueAtTime(0.08, now + 0.12);
    tailGain.gain.exponentialRampToValueAtTime(0.001, now + 0.4);
    tail.connect(tailGain); tailGain.connect(ctx.destination);
    tail.start(now + 0.08); tail.stop(now + 0.42);
  }
  function playDumplingRelease(){
    var ctx = ensureAudio();
    if (!ctx) return;
    var now = ctx.currentTime;
    var osc = ctx.createOscillator();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(115, now);
    osc.frequency.linearRampToValueAtTime(210, now + 0.32);
    var gain = ctx.createGain();
    gain.gain.setValueAtTime(0.0001, now);
    gain.gain.linearRampToValueAtTime(0.16, now + 0.06);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.36);
    osc.connect(gain); gain.connect(ctx.destination);
    osc.start(now); osc.stop(now + 0.38);

    var noise = ctx.createBufferSource();
    noise.buffer = getNoiseBuffer();
    noise.playbackRate.value = 0.9;
    var bp = ctx.createBiquadFilter();
    bp.type = 'bandpass';
    bp.frequency.setValueAtTime(270, now);
    bp.frequency.linearRampToValueAtTime(500, now + 0.3);
    bp.Q.value = 0.6;
    var ng = ctx.createGain();
    ng.gain.setValueAtTime(0.0001, now);
    ng.gain.linearRampToValueAtTime(0.15, now + 0.06);
    ng.gain.exponentialRampToValueAtTime(0.001, now + 0.32);
    noise.connect(bp); bp.connect(ng); ng.connect(ctx.destination);
    noise.start(now); noise.stop(now + 0.34);
  }
  function playAirPuff(ctx, t, amt, dur){
    /* muffled, low, "trapped air escaping" sound - the signature of slime folding/squishing,
       not bright bubbling like water */
    var src = ctx.createBufferSource();
    src.buffer = getNoiseBuffer();
    src.playbackRate.value = 0.55 + Math.random() * 0.15;
    var lp = ctx.createBiquadFilter();
    lp.type = 'lowpass';
    lp.frequency.setValueAtTime(280 + Math.random() * 80, t);
    lp.frequency.exponentialRampToValueAtTime(140, t + dur);
    lp.Q.value = 0.6;
    var g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(amt, t + dur * 0.35);
    g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    src.connect(lp); lp.connect(g); g.connect(ctx.destination);
    src.start(t); src.stop(t + dur + 0.01);
  }
  function playWetSlap(ctx, t, amt){
    /* very short bright broadband transient - the "wet" smack right at first contact,
       layered on top of the thick low squelch so it reads as soggy rather than dry foam */
    var src = ctx.createBufferSource();
    src.buffer = getNoiseBuffer();
    src.playbackRate.value = 2.2 + Math.random() * 0.8;
    var hp = ctx.createBiquadFilter();
    hp.type = 'highpass';
    hp.frequency.value = 1200;
    var bp = ctx.createBiquadFilter();
    bp.type = 'bandpass';
    bp.frequency.value = 2600 + Math.random() * 1200;
    bp.Q.value = 0.9;
    var g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(amt, t + 0.004);
    g.gain.exponentialRampToValueAtTime(0.001, t + 0.045);
    src.connect(hp); hp.connect(bp); bp.connect(g); g.connect(ctx.destination);
    src.start(t); src.stop(t + 0.05);
  }
  function playSlimeGrab(){
    var ctx = ensureAudio();
    if (!ctx) return;
    var now = ctx.currentTime;

    /* thick, low squelch - the core "pressing into dense goo" sound, kept low & wide (not bright/watery) */
    var noise = ctx.createBufferSource();
    noise.buffer = getNoiseBuffer();
    noise.playbackRate.value = 0.62;
    var bp = ctx.createBiquadFilter();
    bp.type = 'bandpass';
    bp.frequency.setValueAtTime(280, now);
    bp.frequency.exponentialRampToValueAtTime(440, now + 0.11);
    bp.Q.value = 1.5;
    var g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, now);
    g.gain.linearRampToValueAtTime(0.42, now + 0.025);
    g.gain.exponentialRampToValueAtTime(0.001, now + 0.22);
    noise.connect(bp); bp.connect(g); g.connect(ctx.destination);
    noise.start(now); noise.stop(now + 0.24);

    /* wet smack right at contact - the "soggy" cue */
    playWetSlap(ctx, now, 0.22);
    playWetSlap(ctx, now + 0.05, 0.1);

    /* trapped air pushed out from inside the slime as your finger sinks in */
    playAirPuff(ctx, now + 0.02, 0.16, 0.22);
  }
  function playSlimeTick(){
    var ctx = ensureAudio();
    if (!ctx) return;
    var now = ctx.currentTime;
    var noise = ctx.createBufferSource();
    noise.buffer = getNoiseBuffer();
    noise.playbackRate.value = 0.5 + Math.random() * 0.2;
    var bp = ctx.createBiquadFilter();
    bp.type = 'bandpass';
    bp.frequency.value = 260 + Math.random() * 200;
    bp.Q.value = 1.3 + Math.random() * 0.8;
    var g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, now);
    g.gain.linearRampToValueAtTime(0.17 + Math.random() * 0.07, now + 0.018);
    g.gain.exponentialRampToValueAtTime(0.001, now + 0.13);
    noise.connect(bp); bp.connect(g); g.connect(ctx.destination);
    noise.start(now); noise.stop(now + 0.15);

    if (Math.random() < 0.5) playWetSlap(ctx, now, 0.06);

    /* faint sticky "creak" - the tacky resistance of slime being pulled thin */
    if (Math.random() < 0.5){
      var creak = ctx.createBufferSource();
      creak.buffer = getNoiseBuffer();
      creak.playbackRate.value = 2.2 + Math.random() * 1.2;
      var cf = ctx.createBiquadFilter();
      cf.type = 'bandpass';
      cf.frequency.value = 1400 + Math.random() * 900;
      cf.Q.value = 7;
      var cg = ctx.createGain();
      cg.gain.setValueAtTime(0.0001, now);
      cg.gain.linearRampToValueAtTime(0.025, now + 0.01);
      cg.gain.exponentialRampToValueAtTime(0.001, now + 0.06);
      creak.connect(cf); cf.connect(cg); cg.connect(ctx.destination);
      creak.start(now); creak.stop(now + 0.07);
    }
  }
  function playSlimeSnap(){
    var ctx = ensureAudio();
    if (!ctx) return;
    var now = ctx.currentTime;

    /* thick fold-back squelch as the strand collapses into the pool */
    var noise = ctx.createBufferSource();
    noise.buffer = getNoiseBuffer();
    noise.playbackRate.value = 0.56;
    var bp = ctx.createBiquadFilter();
    bp.type = 'bandpass';
    bp.frequency.setValueAtTime(320, now);
    bp.frequency.exponentialRampToValueAtTime(210, now + 0.22);
    bp.Q.value = 1.4;
    var g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, now);
    g.gain.linearRampToValueAtTime(0.44, now + 0.014);
    g.gain.exponentialRampToValueAtTime(0.001, now + 0.26);
    noise.connect(bp); bp.connect(g); g.connect(ctx.destination);
    noise.start(now); noise.stop(now + 0.28);

    /* wet smacks as the slime flops back down - soggy, not clean */
    playWetSlap(ctx, now, 0.26);
    playWetSlap(ctx, now + 0.09, 0.13);
    playWetSlap(ctx, now + 0.2, 0.07);

    /* trapped air escaping as the slime folds and settles back into the tray - the real "slime" cue */
    playAirPuff(ctx, now + 0.05, 0.22, 0.34);
    playAirPuff(ctx, now + 0.22, 0.1, 0.3);
  }


  function playRelease(){
    var ctx = ensureAudio();
    if (!ctx) return;
    var now = ctx.currentTime;
    var osc = ctx.createOscillator();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(55, now);
    osc.frequency.linearRampToValueAtTime(100, now + 0.34);
    var gain = ctx.createGain();
    gain.gain.setValueAtTime(0.0001, now);
    gain.gain.linearRampToValueAtTime(0.11, now + 0.05);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.38);
    osc.connect(gain); gain.connect(ctx.destination);
    osc.start(now); osc.stop(now + 0.4);
  }

  /* ---------- three.js scene ---------- */
  var scene = new THREE.Scene();
  var camera = new THREE.PerspectiveCamera(44, holder.clientWidth / holder.clientHeight, 0.1, 100);
  camera.position.set(0, 0.95, 5.6);
  camera.lookAt(0, 0, 0);

  var renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.setClearColor(0x000000, 0);
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  holder.appendChild(renderer.domElement);

  function resizeRenderer(){
    var w = holder.clientWidth, h = holder.clientHeight;
    if (w < 10 || h < 10) return;
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
    renderer.setSize(w, h);
  }
  resizeRenderer();
  window.addEventListener('resize', resizeRenderer);
  window.addEventListener('orientationchange', resizeRenderer);

  scene.add(new THREE.AmbientLight(0xffffff, 0.68));
  var dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
  dirLight.position.set(2.5, 4, 2.5);
  dirLight.castShadow = true;
  dirLight.shadow.mapSize.set(1024, 1024);
  dirLight.shadow.camera.left = -3;
  dirLight.shadow.camera.right = 3;
  dirLight.shadow.camera.top = 3;
  dirLight.shadow.camera.bottom = -3;
  scene.add(dirLight);
  scene.add(new THREE.DirectionalLight(0xfff2d0, 0.25));

  var ground = new THREE.Mesh(
    new THREE.PlaneGeometry(20, 20),
    new THREE.ShadowMaterial({ opacity: 0.2 })
  );
  ground.rotation.x = -Math.PI / 2;
  ground.position.y = -0.44;
  ground.receiveShadow = true;
  scene.add(ground);

  /* sceneGroup is what the drag-to-orbit rotates; each toy squishes independently inside it */
  var sceneGroup = new THREE.Object3D();
  scene.add(sceneGroup);

  var butterGroup = new THREE.Object3D();
  butterGroup.position.set(-1.95, 0, 0);
  sceneGroup.add(butterGroup);

  var baoziGroup = new THREE.Object3D();
  baoziGroup.position.set(0, 0, 0);
  sceneGroup.add(baoziGroup);

  var slimeGroup = new THREE.Object3D();
  slimeGroup.position.set(2.05, 0, 0);
  sceneGroup.add(slimeGroup);

  var butterMesh = new THREE.Mesh(
    new THREE.BoxGeometry(2, 0.7, 0.7),
    new THREE.MeshStandardMaterial({ color: 0xf0c220, roughness: 0.95, metalness: 0 })
  );
  butterMesh.castShadow = true;
  butterGroup.add(butterMesh);

  /* ---------- face definitions: order matches BoxGeometry material array [+x,-x,+y,-y,+z,-z] ---------- */
  var faceDefs = [
    { rot: [0, Math.PI / 2, 0],  center: [1.03, 0, 0],   sizeU: 0.76, sizeV: 0.76, canvasW: 220, canvasH: 220, label: false },
    { rot: [0, -Math.PI / 2, 0], center: [-1.03, 0, 0],  sizeU: 0.76, sizeV: 0.76, canvasW: 220, canvasH: 220, label: false },
    { rot: [-Math.PI / 2, 0, 0], center: [0, 0.38, 0],   sizeU: 2.06, sizeV: 0.76, canvasW: 320, canvasH: 120, label: false },
    { rot: [Math.PI / 2, 0, 0],  center: [0, -0.38, 0],  sizeU: 2.06, sizeV: 0.76, canvasW: 320, canvasH: 120, label: false },
    { rot: [0, 0, 0],            center: [0, 0, 0.38],   sizeU: 2.06, sizeV: 0.76, canvasW: 320, canvasH: 120, label: true  },
    { rot: [0, Math.PI, 0],      center: [0, 0, -0.38],  sizeU: 2.06, sizeV: 0.76, canvasW: 320, canvasH: 120, label: false }
  ];
  var faceBaseColors = ['#efe8d3', '#efe8d3', '#f6f1e2', '#e6dcbd', '#f4eddb', '#eee5c9'];

      }
    }
    for (var i3 = 0; i3 < tubularSeg; i3++){
      for (var j2 = 0; j2 < radialSeg; j2++){
        var a = i3 * ringVerts + j2, b = a + 1, c = a + ringVerts, d = c + 1;
        indices.push(a, c, b, b, c, d);
      }
    }
    /* close the tip with a small fan so the end looks like a naturally pinched, rounded point
       instead of an open tube or a separate ball shape */
    var tipCenterIdx = positions.length / 3;
    var tipFrame = frames[tubularSeg];
    var tipCenter = tipFrame.point;
    positions.push(tipCenter.x, tipCenter.y, tipCenter.z);
    var tipTangent = curve.getTangent(1).normalize();
    normals.push(tipTangent.x, tipTangent.y, tipTangent.z);
    var lastRingStart = tubularSeg * ringVerts;
    for (var j3 = 0; j3 < radialSeg; j3++){
      indices.push(lastRingStart + j3, lastRingStart + j3 + 1, tipCenterIdx);
    }
    var geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
    geo.setAttribute('normal', new THREE.Float32BufferAttribute(normals, 3));
    geo.setIndex(indices);
    return geo;
  }

  function updateSlimeVisual(t){
    var len = slimePull.length();
    if (len < 0.02){
      slimeStrand.visible = false;
      return;
    }
    slimeStrand.visible = true;

    var anchor = new THREE.Vector3(0, slimeAnchorY, 0);
    var tip = anchor.clone().add(slimePull);
    var sag = Math.min(0.45, len * len * 0.09);
    var mid = anchor.clone().add(tip).multiplyScalar(0.5);
    mid.y -= sag;
    var curve = new THREE.QuadraticBezierCurve3(anchor, mid, tip);

    var baseR = Math.max(0.075, Math.min(0.24, 0.26 / (1 + len * 1.05)));
    function radiusFn(u){
      /* necking: thinner in the middle, fuller near the puddle and slightly tapering at the pulled tip */
      var neck = 0.5 + 0.5 * Math.pow(Math.abs(2 * u - 1), 1.6);
      var tipTaper = 1 - 0.35 * Math.max(0, (u - 0.82) / 0.18);
      return baseR * neck * tipTaper;
    }
    var jiggle = slimeIsPulling ? Math.sin(t * 14) * 0.012 : 0;
    var newGeo = buildTaperedTube(curve, 18, 10, radiusFn, jiggle);
    slimeStrand.geometry.dispose();
    slimeStrand.geometry = newGeo;
  }

  /* ---------- squish physics (soft spring-damper) for each toy independently ---------- */
  function makeSquishState(){ return { pos: 0, vel: 0, target: 0 }; }
  var squishButter = makeSquishState();
  var squishBaozi = makeSquishState();
  var squishSlime = makeSquishState();
  var lastCrackDecile = -1;
  var CRACK_STEPS = 10;

  function stepSquish(state, isPressed, dt, sp, dp, sr, dr){
    var stiffness = isPressed ? (sp !== undefined ? sp : 62) : (sr !== undefined ? sr : 24);
    var damping = isPressed ? (dp !== undefined ? dp : 13) : (dr !== undefined ? dr : 6.2);
    var force = (state.target - state.pos) * stiffness - state.vel * damping;
    state.vel += force * dt;
    state.pos += state.vel * dt;
    return Math.max(-0.12, Math.min(1.25, state.pos));
  }

  /* ---------- pointer interaction: raycast picks which toy is pressed; drag orbits the scene ---------- */
  var raycaster = new THREE.Raycaster();
  var canvasEl = renderer.domElement;
  canvasEl.style.cursor = 'grab';

  var isDown = false, isDragging = false, lastX = 0, lastY = 0, downX = 0, downY = 0;
  var pressedTarget = null; // 'butter' | 'baozi' | null

  function getPoint(e){
    if (e.touches && e.touches.length) return { x: e.touches[0].clientX, y: e.touches[0].clientY };
    return { x: e.clientX, y: e.clientY };
  }
  function pickTarget(clientX, clientY){
    var rect = canvasEl.getBoundingClientRect();
    var ndc = new THREE.Vector2(
      ((clientX - rect.left) / rect.width) * 2 - 1,
      -((clientY - rect.top) / rect.height) * 2 + 1
    );
    raycaster.setFromCamera(ndc, camera);
    var hits = raycaster.intersectObjects([waxShell, baoziMesh, puddleMesh, trayBase, trayRim], false);
    if (!hits.length) return null;
    var hit = hits[0];
    var type = hit.object === baoziMesh ? 'baozi'
      : hit.object === puddleMesh ? 'slime'
      : (hit.object === trayBase || hit.object === trayRim) ? 'slimeTray'
      : 'butter';
    return { type: type, point: hit.point };
  }

  function onDown(e){
    isDown = true; isDragging = false;
    var p = getPoint(e);
    lastX = p.x; lastY = p.y; downX = p.x; downY = p.y;
    canvasEl.style.cursor = 'grabbing';

    var picked = pickTarget(p.x, p.y);
    pressedTarget = picked ? picked.type : null;
    if (pressedTarget === 'butter'){
      squishButter.target = 1;
      lastCrackDecile = -1;
      butterDent.pokeLocal.copy(waxShell.worldToLocal(picked.point.clone()));
      butterDent.hasPoke = true;
      playSquishThud();
    } else if (pressedTarget === 'baozi'){
      squishBaozi.target = 1;
      baoziDent.pokeLocal.copy(baoziMesh.worldToLocal(picked.point.clone()));
      baoziDent.hasPoke = true;
      playDumplingSquish();
    } else if (pressedTarget === 'slime'){
      slimeMode = 'squish';
      squishSlime.target = 1;
      slimeDownScreen.x = p.x; slimeDownScreen.y = p.y;
      slimePokeLocal.copy(puddleMesh.worldToLocal(picked.point.clone()));
      slimeHasPoke = true;
      lastRippleTime = performance.now() * 0.001;
      playSlimeGrab();
      lastSlimeTick = performance.now();
    }
  }
  function onMove(e){
    if (!isDown) return;
    var p = getPoint(e);
    var dx = p.x - lastX, dy = p.y - lastY;
    if (Math.abs(p.x - downX) + Math.abs(p.y - downY) > 6) isDragging = true;
    if (isDragging && (pressedTarget === 'butter' || pressedTarget === 'baozi' || pressedTarget === 'slimeTray')){
      /* each toy spins on its own - only the one being dragged turns, never both together */
      var targetGroup = pressedTarget === 'butter' ? butterGroup : (pressedTarget === 'baozi' ? baoziGroup : slimeGroup);
      targetGroup.rotation.y += dx * 0.009;
      targetGroup.rotation.x = Math.max(-0.5, Math.min(0.5, targetGroup.rotation.x + dy * 0.009));
      if (e.cancelable) e.preventDefault();
    } else if (pressedTarget === 'slime'){
      var totalDX = p.x - slimeDownScreen.x, totalDY = p.y - slimeDownScreen.y;
      var dragDist = Math.sqrt(totalDX * totalDX + totalDY * totalDY);
      var PULL_THRESHOLD = 26;
      if (dragDist > PULL_THRESHOLD){
        if (slimeMode !== 'pull'){
          slimeMode = 'pull';
          slimeIsPulling = true;
          squishSlime.target = 0;
        }
        var camRight = new THREE.Vector3(1, 0, 0).applyQuaternion(camera.quaternion);
        var camUp = new THREE.Vector3(0, 1, 0).applyQuaternion(camera.quaternion);
        var excess = dragDist - PULL_THRESHOLD;
        var dirX = totalDX / dragDist, dirY = totalDY / dragDist;
        var dragScale = 0.0078;
        var offset = camRight.multiplyScalar(dirX * excess * dragScale).add(camUp.multiplyScalar(-dirY * excess * dragScale));
        var maxStretch = 2.2;
        if (offset.length() > maxStretch) offset.setLength(maxStretch);
        slimePull.copy(offset);
        var nowT = performance.now();
        if (offset.length() > 0.18 && nowT - lastSlimeTick > 170){
          playSlimeTick();
          lastSlimeTick = nowT;
        }
      }
      if (e.cancelable) e.preventDefault();
    }
    lastX = p.x; lastY = p.y;
  }
  function onUp(){
    if (pressedTarget === 'butter') playRelease();
    else if (pressedTarget === 'baozi') playDumplingRelease();
    else if (pressedTarget === 'slime' && slimeMode === 'pull' && slimePull.length() > 0.05) playSlimeSnap();
    isDown = false; isDragging = false;
    squishButter.target = 0;
    squishBaozi.target = 0;
    squishSlime.target = 0;
    slimeIsPulling = false;
    slimeMode = null;
    pressedTarget = null;
    canvasEl.style.cursor = 'grab';
  }

  canvasEl.addEventListener('mousedown', onDown);
  window.addEventListener('mousemove', onMove);
  window.addEventListener('mouseup', onUp);
  canvasEl.addEventListener('touchstart', onDown, { passive: true });
  canvasEl.addEventListener('touchmove', onMove, { passive: false });
  canvasEl.addEventListener('touchend', onUp);
  canvasEl.addEventListener('touchcancel', onUp);

  var lastT = performance.now();
  function animate(now){
    requestAnimationFrame(animate);
    var dt = Math.min(0.05, (now - lastT) / 1000);
    lastT = now;

    /* butter is back to squishing as a whole, like the very first version */
    var spB = stepSquish(squishButter, pressedTarget === 'butter', dt);
    butterGroup.scale.y = 1 - spB * 0.34;
    var xzB = 1 + spB * 0.17;
    butterGroup.scale.x = xzB; butterGroup.scale.z = xzB;
    butterGroup.position.y = -spB * 0.08;

    var spZ = stepSquish(squishBaozi, pressedTarget === 'baozi', dt);
    baoziDent.amount += (Math.max(0, Math.min(1, spZ)) - baoziDent.amount) * Math.min(1, dt * 10);
    updateDent(baoziDent, baoziGeo, 0.19, 0.3);

    if (pressedTarget === 'butter'){
      var clamped01 = Math.max(0, Math.min(1, squishButter.pos));
      var decile = Math.floor(clamped01 * CRACK_STEPS);
      if (decile > lastCrackDecile){
        for (var d = lastCrackDecile + 1; d <= decile; d++) triggerCrack();
        lastCrackDecile = decile;
      }
    }

    /* slime dent: only presses in locally where you poke, rest of the blob stays put */
    var spS = stepSquish(squishSlime, slimeMode === 'squish', dt, 34, 10, 9, 4.4);
    var dentTarget = Math.max(0, Math.min(1, spS));
    slimeDentAmount += (dentTarget - slimeDentAmount) * Math.min(1, dt * 10);

    if (!slimeIsPulling && slimePull.lengthSq() > 0.0001){
      /* snap back into the puddle: slow, viscous spring (real slime doesn't bounce, it oozes back) */
      var k = 16, damp = 9;
      var force = slimePull.clone().multiplyScalar(-k).addScaledVector(slimePullVel, -damp);
      slimePullVel.addScaledVector(force, dt);
      slimePull.addScaledVector(slimePullVel, dt);
      if (slimePull.length() < 0.015){
        slimePull.set(0, 0, 0);
        slimePullVel.set(0, 0, 0);
      }
    }
    morphPuddle(now * 0.001);
    updateSlimeVisual(now * 0.001);

    renderer.render(scene, camera);
  }
  requestAnimationFrame(animate);
})();
</script>
</body>
</html>
